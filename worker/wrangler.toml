name = "reviewblox-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
OWNER_USERNAME = "Lturtless"  # set to YOUR Roblox username (must match OWNER_USERNAME in index.html)

# D1 database binding — fill in database_id after you create it (see README)
[[d1_databases]]
binding = "DB"
database_name = "reviewblox"
database_id = "0d58c2b4-d3ba-48fe-9335-cc8987925e5e"

# ADMIN_KEY is set as a secret, not here:
#   npx wrangler secret put ADMIN_KEY
