<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReviewBlox — Roblox Game Reviews</title>
<style>
  :root{
    --bg:#0e1016; --card:#181b23; --card2:#20242f; --line:#2b313d;
    --text:#eef0f6; --muted:#98a1b2; --accent:#ff4655; --accent2:#00c2ff; --gold:#ffc53d;
    --chip:#272c38; --green:#1ed47f; --purple:#a16bff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  a{color:inherit;text-decoration:none}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(14,16,22,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{font-weight:900;font-size:1.3rem;display:flex;align-items:center;gap:8px;cursor:pointer}
  .logo b{color:var(--accent)} .logo .box{background:var(--accent);color:#fff;border-radius:7px;padding:2px 7px}
  .topsearch{flex:1;min-width:150px;max-width:420px;position:relative}
  .topsearch input{width:100%;padding:9px 12px 9px 34px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:.92rem}
  .topsearch::before{content:"🔍";position:absolute;left:11px;top:8px;font-size:.9rem;opacity:.7}
  .nav{display:flex;gap:2px;flex-wrap:wrap}
  .nav a{padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:.9rem}
  .nav a.active{background:var(--card2);color:var(--text)}
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px 70px}
  .hero{text-align:center;padding:26px 10px 8px}
  .hero h1{margin:0;font-size:2rem;letter-spacing:-.5px}
  .hero p{margin:8px 0 0;color:var(--muted)}
  .section-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 8px}
  .section-h h2{margin:0;font-size:1.2rem} .section-h a{font-size:.84rem;color:var(--accent2)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  h2{font-size:1.15rem} h3{font-size:1.05rem}
  label{display:block;font-size:.8rem;color:var(--muted);margin:12px 0 4px}
  input,select,textarea{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:.95rem;font-family:inherit}
  textarea{min-height:100px;resize:vertical}
  .row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:150px}
  button.btn{margin-top:14px;padding:11px 18px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-size:.95rem}
  button.btn.alt{background:var(--card2);border:1px solid var(--line);color:var(--text)}
  button.btn.blue{background:var(--accent2);color:#06121a}
  button.btn.sm{padding:7px 12px;font-size:.84rem;margin-top:0}
  .muted{color:var(--muted);font-size:.88rem}
  .note{background:var(--card2);border-left:3px solid var(--accent2);padding:10px 12px;border-radius:8px;font-size:.84rem;color:var(--muted);margin-top:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .12s,transform .12s}
  .gcard:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .gcard .gtitle{font-weight:800;font-size:1rem}
  .gcard .gtags{font-size:.72rem;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .gcard .grate{margin-top:8px;font-size:.82rem;display:flex;align-items:center;gap:6px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .chip{background:var(--chip);padding:5px 10px;border-radius:999px;font-size:.78rem;cursor:pointer;border:1px solid transparent}
  .chip.on{border-color:var(--accent2);color:var(--accent2)}
  .chip.sm{cursor:default;font-size:.7rem;padding:3px 8px}
  .stars{display:inline-flex;gap:4px;font-size:1.7rem;cursor:pointer;margin-top:6px}
  .stars span{color:#3a4150}.stars span.on{color:var(--gold)}
  .starsm{color:var(--gold);letter-spacing:1px}.starsm .off{color:#3a4150}
  .badge{display:inline-flex;align-items:center;gap:4px;background:rgba(161,107,255,.15);color:var(--purple);border:1px solid rgba(161,107,255,.4);padding:1px 8px;border-radius:999px;font-size:.68rem;font-weight:700}
  .review{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .review .by{font-size:.76rem;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .review .body{margin:10px 0 8px;white-space:pre-wrap}
  .review .actions{display:flex;gap:16px;margin-top:10px;font-size:.82rem}
  .review .actions button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.82rem;padding:0}
  .review .actions button.liked{color:var(--accent)}
  .rec{display:flex;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:12px;cursor:pointer}
  .rec:hover{border-color:var(--accent2)}
  .rec .score{min-width:54px;height:54px;border-radius:12px;background:linear-gradient(135deg,var(--accent2),#0077ff);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#fff;line-height:1}
  .rec .score b{font-size:1.15rem}.rec .score i{font-size:.55rem;font-style:normal;opacity:.85;margin-top:2px}
  .rec .why{font-size:.82rem;color:var(--green);margin-top:5px}
  .empty{text-align:center;color:var(--muted);padding:34px}
  .bar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent2)}
  .chartrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:.84rem}
  .chartrow .lab{width:130px;color:var(--muted);text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chartrow .bar{flex:1}.chartrow .val{width:34px;text-align:right;color:var(--muted);font-size:.78rem}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .toolbar input{flex:2;min-width:160px}.toolbar select{flex:1;min-width:130px}
  .stat{display:flex;gap:22px;flex-wrap:wrap}
  .stat div b{font-size:1.5rem}.stat div span{display:block;font-size:.74rem;color:var(--muted)}
  .back{display:inline-block;color:var(--accent2);font-size:.86rem;margin-bottom:10px;cursor:pointer}
  .gamehead{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .big-rate{font-size:2.4rem;font-weight:900;line-height:1}
  footer{text-align:center;padding:24px;color:var(--muted);font-size:.78rem}
  .apiflag{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted)}
  .apiflag.on{color:var(--green)}
</style>

/* ---------- Store (API when configured, else localStorage) ---------- */
const LS_KEY="reviewblox_v2";
let state={ reviews:[], critics:[], favorites:[] };
const online = !!API_BASE;

function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function loadLocal(){ try{ const d=JSON.parse(localStorage.getItem(LS_KEY)); if(d){ state.reviews=d.reviews||[]; state.critics=d.critics||[]; state.favorites=d.favorites||[]; } }catch(e){} }

async function api(path,opts){ const r=await fetch(API_BASE+path,Object.assign({headers:{"Content-Type":"application/json"}},opts)); if(!r.ok) throw new Error("API "+r.status); return r.json(); }

async function boot(){
  loadLocal(); // cache/fallback
  if(online){
    try{
      const d=await api("/api/state");
      state.reviews=d.reviews||[]; state.critics=d.critics||[];
      document.getElementById("apiFlag").textContent="shared mode · live"; document.getElementById("apiFlag").classList.add("on");
      saveLocal();
    }catch(e){
      document.getElementById("apiFlag").textContent="shared mode offline — showing local";
    }
  }
  buildDatalist(); route();
}

async function addReview(r){
  if(online){ try{ const saved=await api("/api/reviews",{method:"POST",body:JSON.stringify(r)}); state.reviews.push(saved); saveLocal(); return; }catch(e){ alert("Couldn't reach the server; saved locally instead."); } }
  state.reviews.push(r); saveLocal();
}
async function updateReview(id,patch){
  const r=state.reviews.find(x=>x.id===id); if(!r) return; Object.assign(r,patch);
  if(online){ try{ await api("/api/reviews/"+id,{method:"PATCH",body:JSON.stringify(patch)}); }catch(e){} }
  saveLocal();
}
async function deleteReview(id){
  state.reviews=state.reviews.filter(x=>x.id!==id);
  if(online){ try{ await api("/api/reviews/"+id,{method:"DELETE"}); }catch(e){} }
  saveLocal();
}
async function likeReview(id){
  const r=state.reviews.find(x=>x.id===id); if(!r) return;
  r.liked=!r.liked; r.likes=(r.likes||0)+(r.liked?1:-1); if(r.likes<0)r.likes=0;
  if(online){ try{ await api("/api/reviews/"+id+"/like",{method:"POST",body:JSON.stringify({liked:r.liked})}); }catch(e){} }
  saveLocal();
}
async function setCritics(list,adminKey){
  if(online){ try{ await api("/api/critics",{method:"PUT",body:JSON.stringify({critics:list,adminKey})}); }catch(e){ alert("Server rejected the change (admin key?). Saved locally only."); } }
  state.critics=list; saveLocal();
}

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function slug(s){ return encodeURIComponent(s); }
function starStr(r){ let s=""; for(let i=1;i<=5;i++) s+= i<=Math.round(r)?"★":'<span class="off">★</span>'; return '<span class="starsm">'+s+"</span>"; }
function isCritic(name){ return state.critics.some(c=>c.toLowerCase()===String(name).toLowerCase()); }
function robloxUrl(name){ return "https://www.roblox.com/games/?keyword="+encodeURIComponent(name); }

function catalogMap(){ const m={}; CATALOG.forEach(([n,g,p])=>m[n.toLowerCase()]={name:n,genres:g,pop:p}); return m; }
const CAT=catalogMap();

function allGames(){
  // union of catalog + any reviewed game
  const map={};
  CATALOG.forEach(([n,g,p])=>{ map[n.toLowerCase()]={name:n,genres:g.slice(),pop:p,reviews:[]}; });
  state.reviews.forEach(r=>{
    const k=r.game.toLowerCase();
    if(!map[k]) map[k]={name:r.game,genres:(r.genres||[]).slice(),pop:0,reviews:[]};
    map[k].reviews.push(r);
    (r.genres||[]).forEach(g=>{ if(!map[k].genres.includes(g)) map[k].genres.push(g); });
  });
  return Object.values(map).map(g=>{
    const n=g.reviews.length;
    g.avg = n? g.reviews.reduce((a,r)=>a+r.rating,0)/n : 0;
    g.count=n;
    return g;
  });
}
function gameByName(name){ return allGames().find(g=>g.name.toLowerCase()===name.toLowerCase()); }

function buildDatalist(){ document.getElementById("gameNames").innerHTML=CATALOG.map(c=>'<option value="'+esc(c[0])+'">').join(""); }

/* ---------- Router ---------- */
function route(){
  const h=location.hash.split("?")[0].replace(/^#\/?/,"");
  const [path,rest]=h.split("/");
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("active",(a.dataset.r||"")===path));
  const v=document.getElementById("view");
  if(path==="" ) renderHome(v);
  else if(path==="browse") renderBrowse(v);
  else if(path==="game") renderGame(v,decodeURIComponent(rest||""));
  else if(path==="write") renderWrite(v);
  else if(path==="charts") renderCharts(v);
  else if(path==="critics") renderCritics(v);
  else if(path==="account") renderAccount(v);
  else renderHome(v);
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

/* top search */
document.getElementById("topSearch").addEventListener("keydown",e=>{
  if(e.key==="Enter"){ const q=e.target.value.trim(); location.hash="#/browse"+(q?("?q="+encodeURIComponent(q)):""); }
});

function qparam(name){ const m=location.hash.match(new RegExp("[?&]"+name+"=([^&]+)")); return m?decodeURIComponent(m[1]):""; }

/* ---------- HOME ---------- */
function renderHome(v){
  const games=allGames();
  const reviewed=games.filter(g=>g.count>0);
  const trending=[...reviewed].sort((a,b)=>b.count-a.count).slice(0,6);
  const topRated=[...reviewed].filter(g=>g.count>=1).sort((a,b)=>b.avg-a.avg||b.count-a.count).slice(0,6);
  const latest=[...state.reviews].sort((a,b)=>b.date-a.date).slice(0,4);
  const nReviews=state.reviews.length, nGames=reviewed.length;
  const avg=nReviews?(state.reviews.reduce((a,r)=>a+r.rating,0)/nReviews):0;

  v.innerHTML=`
  <div class="hero">
    <h1>Honest Roblox game reviews.</h1>
    <p>Browse ${CATALOG.length}+ games, read & write reviews, and get recommendations.</p>
    <button class="btn" onclick="location.hash='#/write'">✍️ Write a review</button>
    <button class="btn blue" onclick="location.hash='#/browse'">🔎 Browse games</button>
  </div>
  <div class="card"><div class="stat">
    <div><b>${nReviews}</b><span>reviews</span></div>
    <div><b>${nGames}</b><span>games reviewed</span></div>
    <div><b>${avg?avg.toFixed(1):"—"}</b><span>avg rating</span></div>
    <div><b>${state.critics.length}</b><span>pro critics</span></div>
  </div></div>

  ${trending.length?`<div class="section-h"><h2>🔥 Trending</h2><a href="#/browse">See all</a></div>
   <div class="grid">${trending.map(gcard).join("")}</div>`:""}

  ${topRated.length?`<div class="section-h"><h2>⭐ Top rated</h2></div>
   <div class="grid">${topRated.map(gcard).join("")}</div>`:""}

  <div class="section-h"><h2>🕘 Latest reviews</h2></div>
  ${latest.length? latest.map(reviewCard).join("") : '<div class="empty">No reviews yet. <button class="btn sm" onclick="location.hash=\'#/write\'">Be the first</button></div>'}

  ${!reviewed.length?`<div class="section-h"><h2>🎮 Popular games to review</h2></div>
   <div class="grid">${games.sort((a,b)=>b.pop-a.pop).slice(0,9).map(gcard).join("")}</div>`:""}
  `;
}
function gcard(g){
  const rate = g.count? `${starStr(g.avg)} <span class="muted">${g.avg.toFixed(1)} · ${g.count} review${g.count>1?"s":""}</span>` : '<span class="muted">No reviews yet</span>';
  return `<div class="gcard" onclick="location.hash='#/game/${slug(g.name)}'">
    <div class="gtitle">${esc(g.name)}</div>
    <div class="gtags">${g.genres.map(esc).join(" · ")}</div>
    <div class="grate">${rate}</div>
  </div>`;
}

/* ---------- BROWSE ---------- */
function renderBrowse(v){
  const q0=qparam("q");
  v.innerHTML=`
    <div class="hero" style="padding-top:10px"><h1>Browse games</h1><p>Search our catalog or review any game by name.</p></div>
    <div class="toolbar">
      <input id="bSearch" placeholder="Search game name or tag…" value="${esc(q0)}">
      <select id="bTag"><option value="">All tags</option>${OFFICIAL_TAGS.map(t=>`<option>${esc(t)}</option>`).join("")}</select>
      <select id="bSort">
        <option value="pop">Popular</option>
        <option value="top">Top rated</option>
        <option value="most">Most reviewed</option>
        <option value="az">A–Z</option>
      </select>
    </div>
    <div id="bResults"></div>`;
  const run=()=>{
    const q=document.getElementById("bSearch").value.toLowerCase().trim();
    const tag=document.getElementById("bTag").value;
    const sort=document.getElementById("bSort").value;
    let list=allGames();
    if(tag) list=list.filter(g=>g.genres.includes(tag));
    if(q) list=list.filter(g=>g.name.toLowerCase().includes(q)||g.genres.some(x=>x.toLowerCase().includes(q)));
    list.sort((a,b)=>({pop:b.pop-a.pop||b.count-a.count, top:b.avg-a.avg||b.count-a.count, most:b.count-a.count, az:a.name.localeCompare(b.name)})[sort]);
    const res=document.getElementById("bResults");
    let html="";
    if(q && !list.some(g=>g.name.toLowerCase()===q)){
      html+=`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div>Can't find <strong>"${esc(q)}"</strong>? You can still review any Roblox game.</div>
        <button class="btn sm blue" onclick="location.hash='#/write?g=${encodeURIComponent(document.getElementById('bSearch').value.trim())}'">Review "${esc(document.getElementById('bSearch').value.trim())}"</button></div>`;
    }
    html+= list.length? `<div class="grid">${list.slice(0,60).map(gcard).join("")}</div>` : '<div class="empty">No games match.</div>';
    res.innerHTML=html;
  };
  document.getElementById("bSearch").oninput=run;
  document.getElementById("bTag").onchange=run;
  document.getElementById("bSort").onchange=run;
  run();
}

/* ---------- GAME DETAIL ---------- */
function renderGame(v,name){
  const g=gameByName(name) || {name,genres:(CAT[name.toLowerCase()]?.genres||[]),reviews:[],avg:0,count:0};
  const reviews=[...(g.reviews||[])].sort((a,b)=>(isCritic(b.author)-isCritic(a.author))||b.date-a.date);
  // rating distribution
  const dist=[0,0,0,0,0]; reviews.forEach(r=>dist[r.rating-1]++);
  const maxd=Math.max(1,...dist);
  v.innerHTML=`
    <span class="back" onclick="history.back()">← Back</span>
    <div class="card">
      <div class="gamehead">
        <div>
          <h2 style="margin:0 0 4px">${esc(g.name)}</h2>
          <div class="chips">${g.genres.map(t=>'<span class="chip sm">'+esc(t)+'</span>').join("")}</div>
          <div style="margin-top:8px"><a class="muted" href="${robloxUrl(g.name)}" target="_blank" rel="noopener">Open on Roblox ↗</a></div>
        </div>
        <div style="text-align:center">
          <div class="big-rate">${g.count?g.avg.toFixed(1):"—"}</div>
          <div>${g.count?starStr(g.avg):""}</div>
          <div class="muted" style="font-size:.76rem">${g.count} review${g.count!==1?"s":""}</div>
        </div>
      </div>
      ${g.count?`<div style="margin-top:14px">${[5,4,3,2,1].map(s=>`
        <div class="chartrow"><div class="lab">${s} ★</div><div class="bar"><i style="width:${Math.round(dist[s-1]/maxd*100)}%;background:var(--gold)"></i></div><div class="val">${dist[s-1]}</div></div>`).join("")}</div>`:""}
      <button class="btn" onclick="location.hash='#/write?g=${slug(g.name)}'">Write a review for ${esc(g.name)}</button>
    </div>
    <div class="section-h"><h2>Reviews</h2></div>
    ${reviews.length? reviews.map(reviewCard).join("") : '<div class="empty">No reviews yet — be the first!</div>'}
  `;
}

/* ---------- REVIEW CARD ---------- */
function reviewCard(r){
  const when=new Date(r.date).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  const critic=isCritic(r.author)?'<span class="badge">✔ Pro Critic</span>':"";
  return `<div class="review">
    <div><a href="#/game/${slug(r.game)}" style="font-weight:800;font-size:1.05rem">${esc(r.game)}</a></div>
    <div class="by">${starStr(r.rating)} · by ${esc(r.author)} ${critic} · ${when}${r.edited?" (edited)":""}</div>
    ${r.body?`<div class="body">${esc(r.body)}</div>`:""}
    <div class="chips">${(r.genres||[]).map(x=>'<span class="chip sm">'+esc(x)+'</span>').join("")}</div>
    <div class="actions">
      <button onclick="onLike('${r.id}')" class="${r.liked?'liked':''}">${r.liked?'❤️':'🤍'} ${r.likes||0}</button>
      <button onclick="onEdit('${r.id}')">✏️ Edit</button>
      <button onclick="onDelete('${r.id}')">🗑 Delete</button>
    </div>
  </div>`;
}
async function onLike(id){ await likeReview(id); route(); }
async function onDelete(id){ if(confirm("Delete this review?")){ await deleteReview(id); route(); } }
function onEdit(id){ location.hash="#/write?edit="+id; }

/* ---------- WRITE ---------- */
let writeStars=0;
function renderWrite(v){
  const editId=qparam("edit");
  const pre=qparam("g");
  const editing = editId ? state.reviews.find(r=>r.id===editId) : null;
  writeStars = editing? editing.rating : 0;
  const curTags = editing? (editing.genres||[]) : (pre&&CAT[pre.toLowerCase()]?CAT[pre.toLowerCase()].genres:[]);
  v.innerHTML=`
    <span class="back" onclick="history.back()">← Back</span>
    <div class="card">
      <h2>${editing?"Edit review":"Write a review"}</h2>
      <div class="row">
        <div><label>Game name</label><input id="wName" list="gameNames" placeholder="Start typing…" value="${esc(editing?editing.game:pre)}"></div>
        <div><label>Your name</label><input id="wAuthor" placeholder="Anonymous" value="${esc(editing?(editing.author==='Anonymous'?'':editing.author):'')}"></div>
      </div>
      <label>Your rating</label>
      <div class="stars" id="starInput">${[1,2,3,4,5].map(i=>`<span data-v="${i}">★</span>`).join("")}</div>
      <label>Tags <span class="muted">(official Roblox genres — click to toggle)</span></label>
      <input id="tagFilter" placeholder="Filter tags…" style="margin-bottom:6px">
      <div class="chips" id="tagPicker" style="max-height:170px;overflow:auto"></div>
      <label>Your review</label>
      <textarea id="wBody" placeholder="What's good, what's not, who's it for?">${esc(editing?editing.body||"":"")}</textarea>
      <button class="btn" id="saveBtn">${editing?"Save changes":"Publish review"}</button>
    </div>`;
  // stars
  const si=document.getElementById("starInput");
  const paint=n=>si.querySelectorAll("span").forEach(s=>s.classList.toggle("on",+s.dataset.v<=n));
  si.querySelectorAll("span").forEach(s=>{ s.onmouseenter=()=>paint(+s.dataset.v); s.onclick=()=>{writeStars=+s.dataset.v;paint(writeStars);}; });
  si.onmouseleave=()=>paint(writeStars); paint(writeStars);
  // tags
  const tp=document.getElementById("tagPicker");
  const renderTags=(f="")=>{ tp.innerHTML=OFFICIAL_TAGS.filter(t=>t.toLowerCase().includes(f.toLowerCase())).map(t=>`<span class="chip${curTags.includes(t)?' on':''}" data-t="${esc(t)}">${esc(t)}</span>`).join("");
    tp.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ const t=c.dataset.t; const i=curTags.indexOf(t); if(i<0)curTags.push(t); else curTags.splice(i,1); c.classList.toggle("on"); }); };
  renderTags();
  document.getElementById("tagFilter").oninput=e=>renderTags(e.target.value);
  // save
  document.getElementById("saveBtn").onclick=async()=>{
    const name=document.getElementById("wName").value.trim();
    const body=document.getElementById("wBody").value.trim();
    const author=document.getElementById("wAuthor").value.trim()||"Anonymous";
    if(!name) return alert("Enter a game name.");
    if(!writeStars) return alert("Pick a star rating.");
    if(editing){ await updateReview(editId,{game:name,author,rating:writeStars,genres:curTags.slice(),body,edited:Date.now()}); location.hash="#/game/"+slug(name); }
    else { await addReview({id:uid(),game:name,author,rating:writeStars,genres:curTags.slice(),body,likes:0,liked:false,date:Date.now()}); location.hash="#/game/"+slug(name); }
  };
}

/* ---------- CHARTS ---------- */
function renderCharts(v){
  const reviews=state.reviews;
  if(!reviews.length){ v.innerHTML='<div class="hero"><h1>Charts</h1></div><div class="empty">No data yet. Write some reviews to see charts.</div>'; return; }
  // rating distribution
  const dist=[0,0,0,0,0]; reviews.forEach(r=>dist[r.rating-1]++); const maxd=Math.max(...dist);
  // genre counts
  const gc={}; reviews.forEach(r=>(r.genres||[]).forEach(g=>gc[g]=(gc[g]||0)+1));
  const genres=Object.entries(gc).sort((a,b)=>b[1]-a[1]).slice(0,10); const maxg=Math.max(1,...genres.map(x=>x[1]));
  // top rated games (min 1 review)
  const games=allGames().filter(g=>g.count>0).sort((a,b)=>b.avg-a.avg||b.count-a.count).slice(0,10); const maxa=5;
  // critic vs community
  const crit=reviews.filter(r=>isCritic(r.author)), comm=reviews.filter(r=>!isCritic(r.author));
  const cavg=crit.length?crit.reduce((a,r)=>a+r.rating,0)/crit.length:0;
  const uavg=comm.length?comm.reduce((a,r)=>a+r.rating,0)/comm.length:0;

  v.innerHTML=`
    <div class="hero" style="padding-top:10px"><h1>📊 Charts</h1></div>
    <div class="card"><h2>Rating distribution</h2>
      ${[5,4,3,2,1].map(s=>`<div class="chartrow"><div class="lab">${s} ★</div><div class="bar"><i style="width:${Math.round(dist[s-1]/Math.max(1,maxd)*100)}%;background:var(--gold)"></i></div><div class="val">${dist[s-1]}</div></div>`).join("")}
    </div>
    <div class="card"><h2>Reviews by tag</h2>
      ${genres.map(([g,n])=>`<div class="chartrow"><div class="lab">${esc(g)}</div><div class="bar"><i style="width:${Math.round(n/maxg*100)}%"></i></div><div class="val">${n}</div></div>`).join("")}
    </div>
    <div class="card"><h2>Top rated games</h2>
      ${games.map(g=>`<div class="chartrow"><div class="lab">${esc(g.name)}</div><div class="bar"><i style="width:${Math.round(g.avg/maxa*100)}%;background:var(--green)"></i></div><div class="val">${g.avg.toFixed(1)}</div></div>`).join("")}
    </div>
    ${crit.length?`<div class="card"><h2>Critics vs community</h2>
      <div class="chartrow"><div class="lab">Pro critics</div><div class="bar"><i style="width:${Math.round(cavg/5*100)}%;background:var(--purple)"></i></div><div class="val">${cavg.toFixed(1)}</div></div>
      <div class="chartrow"><div class="lab">Community</div><div class="bar"><i style="width:${Math.round(uavg/5*100)}%"></i></div><div class="val">${uavg.toFixed(1)}</div></div>
    </div>`:""}
  `;
}

/* ---------- CRITICS ---------- */
function renderCritics(v){
  v.innerHTML=`
    <div class="hero" style="padding-top:10px"><h1>⭐ Professional Critics</h1><p>Verified reviewers whose takes carry a badge and extra weight.</p></div>
    <div class="card">
      <h2>Current critics <span class="muted">(${state.critics.length})</span></h2>
      <div id="critList">${state.critics.length? state.critics.map(c=>`<div class="review" style="display:flex;justify-content:space-between;align-items:center"><div><strong>${esc(c)}</strong> <span class="badge">✔ Pro Critic</span></div><button class="btn alt sm" onclick="removeCritic('${esc(c).replace(/'/g,"\\'")}')">Remove</button></div>`).join("") : '<div class="muted">No critics yet.</div>'}</div>
    </div>
    <div class="card">
      <h2>Promote a reviewer</h2>
      <label>Reviewer name (exactly as they sign reviews)</label>
      <input id="critName" placeholder="e.g. BloxCritic99">
      ${online?`<label>Admin key</label><input id="adminKey" type="password" placeholder="owner admin key">`:""}
      <button class="btn" onclick="addCritic()">Make Professional Critic</button>
      <div class="note">${online?"Promotions are saved to the shared server and require the owner's admin key.":"Local mode: critic badges apply only in this browser. Connect the backend to make them real & shared."}</div>
    </div>`;
}
async function addCritic(){
  const name=document.getElementById("critName").value.trim(); if(!name)return alert("Enter a name.");
  if(isCritic(name))return alert("Already a critic.");
  const key=online?document.getElementById("adminKey").value.trim():"";
  await setCritics([...state.critics,name],key); route();
}
async function removeCritic(name){
  const key=online?prompt("Admin key to remove a critic:"):""; if(online&&!key)return;
  await setCritics(state.critics.filter(c=>c.toLowerCase()!==name.toLowerCase()),key); route();
}

/* ---------- ACCOUNT ---------- */
function renderAccount(v){
  v.innerHTML=`
    <div class="hero" style="padding-top:10px"><h1>Account</h1></div>
    <div class="card">
      <h2>Recommended for you</h2>
      <p class="muted" id="tasteSummary"></p>
      <div id="tasteBars"></div>
      <div id="recList"></div>
    </div>
    <div class="card">
      <h2>Link your Roblox account</h2>
      <label>Roblox username</label><input id="rbxUser" placeholder="e.g. builderman">
      <button class="btn" id="linkBtn">Import my favorite games</button>
      <div class="note"><strong>How this works:</strong> Roblox has no public API for games you've <em>played</em>, so this imports the games you've publicly <strong>favorited</strong> and uses them to boost your recommendations. If Roblox blocks the request (CORS), your reviews still power recommendations.</div>
      <div id="linkStatus" class="muted" style="margin-top:12px"></div><div id="favList" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <h2>Your data</h2>
      <p class="muted">${online?"Reviews are shared via the server.":"Reviews are stored locally in this browser."} Favorites & likes are stored locally.</p>
      <button class="btn alt" onclick="exportData()">Export (JSON)</button>
      <button class="btn alt" onclick="clearData()">Clear local data</button>
    </div>`;
  renderRecsInto();
  document.getElementById("linkBtn").onclick=linkRoblox;
}
function buildTaste(){
  const w={};
  state.reviews.forEach(r=>{ const weight=(r.rating-2.5)*(isCritic(r.author)?1.5:1); (r.genres||[]).forEach(g=>w[g]=(w[g]||0)+weight); });
  state.favorites.forEach(f=>{ const c=CAT[f.toLowerCase()]; if(c)c.genres.forEach(g=>w[g]=(w[g]||0)+0.75); });
  return w;
}
function renderRecsInto(){
  const taste=buildTaste();
  const pos=Object.entries(taste).filter(([,x])=>x>0).sort((a,b)=>b[1]-a[1]);
  const sum=document.getElementById("tasteSummary"), bars=document.getElementById("tasteBars"), list=document.getElementById("recList");
  if(!pos.length){ sum.textContent="Review a few games (3★+ with tags) to unlock recommendations."; bars.innerHTML=""; list.innerHTML=""; return; }
  sum.textContent="You lean toward: "+pos.slice(0,3).map(x=>x[0]).join(", ");
  bars.innerHTML=pos.slice(0,5).map(([g,x])=>`<div style="margin-top:8px"><div class="muted" style="font-size:.78rem">${esc(g)}</div><div class="bar"><i style="width:${Math.round(x/pos[0][1]*100)}%"></i></div></div>`).join("");
  const reviewed=new Set(state.reviews.map(r=>r.game.toLowerCase()));
  const scored=CATALOG.map(([n,g])=>({name:n,genres:g})).filter(c=>!reviewed.has(c.name.toLowerCase())).map(c=>{
    let s=0,m=[]; c.genres.forEach(g=>{ if(taste[g]>0){s+=taste[g];m.push(g);} });
    if(state.favorites.some(f=>f.toLowerCase()===c.name.toLowerCase()))s+=1.5;
    return {...c,score:s,matched:m};
  }).filter(c=>c.score>0).sort((a,b)=>b.score-a.score).slice(0,10);
  if(!scored.length){ list.innerHTML='<div class="muted" style="margin-top:12px">No matches yet.</div>'; return; }
  const max=scored[0].score;
  list.innerHTML=scored.map(c=>`<div class="rec" onclick="location.hash='#/game/${slug(c.name)}'">
    <div class="score"><b>${Math.round(c.score/max*100)}</b><i>MATCH</i></div>
    <div><h3>${esc(c.name)}</h3><div class="muted" style="font-size:.78rem">${c.genres.map(esc).join(" · ")}</div><div class="why">Because you like ${c.matched.map(esc).join(", ")}</div></div>
  </div>`).join("");
}
async function linkRoblox(){
  const user=document.getElementById("rbxUser").value.trim();
  const status=document.getElementById("linkStatus"), favEl=document.getElementById("favList");
  if(!user)return status.textContent="Enter a username first.";
  status.textContent="Looking up "+user+"…"; favEl.innerHTML="";
  try{
    const r=await fetch("https://users.roblox.com/v1/usernames/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({usernames:[user],excludeBannedUsers:true})});
    const d=await r.json(); if(!d.data||!d.data.length)return status.textContent="No Roblox user found.";
    const id=d.data[0].id; status.textContent="Fetching favorited games…";
    const fr=await fetch(`https://games.roblox.com/v2/users/${id}/favorite/games?limit=25&sortOrder=Desc`);
    const fd=await fr.json(); const titles=(fd.data||[]).map(x=>x.name).filter(Boolean);
    if(!titles.length)return status.textContent="Linked, but no public favorites found.";
    state.favorites=titles; saveLocal();
    status.innerHTML=`✅ Imported ${titles.length} favorites from <strong>${esc(user)}</strong>.`;
    favEl.innerHTML='<div class="chips">'+titles.map(t=>'<span class="chip sm">'+esc(t)+'</span>').join("")+'</div>';
    renderRecsInto();
  }catch(e){ status.innerHTML="⚠️ Roblox blocked the request from the browser (CORS). Your reviews still power recommendations."; }
}
function exportData(){ const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="reviewblox-backup.json"; a.click(); }
function clearData(){ if(confirm("Clear local reviews, critics & favorites from THIS browser?")){ state={reviews:[],critics:[],favorites:[]}; saveLocal(); location.hash="#/"; route(); } }

boot();
</script>
</body>
</html>
