<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReviewBlox — Roblox Game Reviews</title>
<style>
  :root{
    --bg:#0e1016; --card:#181b23; --card2:#20242f; --line:#2b313d;
    --text:#eef0f6; --muted:#98a1b2; --accent:#ff4655; --accent2:#00c2ff; --gold:#ffc53d;
    --chip:#272c38; --green:#1ed47f; --purple:#a16bff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  a{color:inherit;text-decoration:none}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(14,16,22,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{font-weight:900;font-size:1.3rem;display:flex;align-items:center;gap:8px;cursor:pointer}
  .logo b{color:var(--accent)} .logo .box{background:var(--accent);color:#fff;border-radius:7px;padding:2px 7px}
  .topsearch{flex:1;min-width:140px;max-width:380px;position:relative}
  .topsearch input{width:100%;padding:9px 12px 9px 34px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:.92rem}
  .topsearch::before{content:"🔍";position:absolute;left:11px;top:8px;font-size:.9rem;opacity:.7}
  .nav{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
  .nav a{padding:8px 11px;border-radius:8px;color:var(--muted);font-weight:600;font-size:.9rem;cursor:pointer}
  .nav a.active{background:var(--card2);color:var(--text)}
  .acctchip{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);padding:6px 10px;border-radius:999px;font-size:.84rem;cursor:pointer}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 70px}
  .hero{text-align:center;padding:26px 10px 8px}
  .hero h1{margin:0;font-size:2rem;letter-spacing:-.5px}.hero p{margin:8px 0 0;color:var(--muted)}
  .section-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 8px}
  .section-h h2{margin:0;font-size:1.2rem}.section-h a{font-size:.84rem;color:var(--accent2);cursor:pointer}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  h2{font-size:1.15rem}h3{font-size:1.05rem}
  label{display:block;font-size:.8rem;color:var(--muted);margin:12px 0 4px}
  input,select,textarea{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:.95rem;font-family:inherit}
  textarea{min-height:100px;resize:vertical}
  .row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:150px}
  button.btn{margin-top:14px;padding:11px 18px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-size:.95rem}
  button.btn.alt{background:var(--card2);border:1px solid var(--line);color:var(--text)}
  button.btn.blue{background:var(--accent2);color:#06121a}
  button.btn.sm{padding:7px 12px;font-size:.84rem;margin-top:0}
  .muted{color:var(--muted);font-size:.88rem}
  .note{background:var(--card2);border-left:3px solid var(--accent2);padding:10px 12px;border-radius:8px;font-size:.84rem;color:var(--muted);margin-top:12px}
  .note.warn{border-left-color:var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .12s,transform .12s}
  .gcard:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .gcard .thumb{width:100%;aspect-ratio:1/1;background:var(--card2);object-fit:cover;display:block}
  .gcard .body{padding:11px 12px}
  .gcard .gtitle{font-weight:800;font-size:.98rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .gcard .gtags{font-size:.7rem;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .gcard .grate{margin-top:7px;font-size:.8rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ccu{font-size:.7rem;color:var(--green)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .chip{background:var(--chip);padding:5px 10px;border-radius:999px;font-size:.78rem;cursor:pointer;border:1px solid transparent}
  .chip.on{border-color:var(--accent2);color:var(--accent2)}
  .chip.sm{cursor:default;font-size:.7rem;padding:3px 8px}
  .stars{display:inline-flex;gap:4px;font-size:1.7rem;cursor:pointer;margin-top:6px}
  .stars span{color:#3a4150}.stars span.on{color:var(--gold)}
  .starsm{color:var(--gold);letter-spacing:1px}.starsm .off{color:#3a4150}
  .badge{display:inline-flex;align-items:center;gap:4px;background:rgba(161,107,255,.15);color:var(--purple);border:1px solid rgba(161,107,255,.4);padding:1px 8px;border-radius:999px;font-size:.68rem;font-weight:700}
  .review{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .review .by{font-size:.76rem;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .review .body{margin:10px 0 8px;white-space:pre-wrap}
  .review .actions{display:flex;gap:16px;margin-top:10px;font-size:.82rem}
  .review .actions button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.82rem;padding:0}
  .review .actions button.liked{color:var(--accent)}
  .rec{display:flex;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:12px;cursor:pointer}
  .rec:hover{border-color:var(--accent2)}
  .rec .score{min-width:54px;height:54px;border-radius:12px;background:linear-gradient(135deg,var(--accent2),#0077ff);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#fff;line-height:1}
  .rec .score b{font-size:1.15rem}.rec .score i{font-size:.55rem;font-style:normal;opacity:.85;margin-top:2px}
  .rec .why{font-size:.82rem;color:var(--green);margin-top:5px}
  .empty{text-align:center;color:var(--muted);padding:34px}
  .bar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent2)}
  .chartrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:.84rem}
  .chartrow .lab{width:150px;color:var(--muted);text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chartrow .bar{flex:1}.chartrow .val{width:50px;text-align:right;color:var(--muted);font-size:.78rem}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .toolbar input{flex:2;min-width:160px}.toolbar select{flex:1;min-width:130px}
  .stat{display:flex;gap:22px;flex-wrap:wrap}.stat div b{font-size:1.5rem}.stat div span{display:block;font-size:.74rem;color:var(--muted)}
  .back{display:inline-block;color:var(--accent2);font-size:.86rem;margin-bottom:10px;cursor:pointer}
  .gamehead{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  .gamehead img{width:120px;height:120px;border-radius:12px;object-fit:cover;background:var(--card2)}
  .big-rate{font-size:2.4rem;font-weight:900;line-height:1}
  footer{text-align:center;padding:24px;color:var(--muted);font-size:.78rem}
  .apiflag{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted)}.apiflag.on{color:var(--green)}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo" onclick="location.hash='#/'"><span class="box">R</span><span>Review<b>Blox</b></span></div>
  <div class="topsearch"><input id="topSearch" placeholder="Search Roblox games…" autocomplete="off"></div>
  <nav class="nav" id="nav">
    <a onclick="location.hash='#/'" data-r="">Home</a>
    <a onclick="location.hash='#/browse'" data-r="browse">Browse</a>
    <a onclick="location.hash='#/charts'" data-r="charts">Charts</a>
    <a onclick="location.hash='#/critics'" data-r="critics">Critics</a>
    <span id="acctSlot"></span>
  </nav>
</div>

<div class="wrap"><div id="view"><div class="empty">Loading games…</div></div></div>
<footer>ReviewBlox · a fan-made Roblox review site · not affiliated with Roblox Corporation · <span id="apiFlag" class="apiflag">local mode</span></footer>
<datalist id="gameNames"></datalist>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const API_BASE = "https://reviewblox-api.lukeschnipperxyz.workers.dev"; // shared mode — live backend
const OWNER_USERNAME = "Lturtless"; // <-- set this to YOUR Roblox username (the admin who can promote critics)

/* ---------- Official Roblox genres & subgenres ---------- */
const OFFICIAL_TAGS = ["Action","Battlegrounds & Fighting","Open World Action","Music & Rhythm","Adventure","Exploration","Scavenger & Hunt","Story","Education","Entertainment","Obby & Platformer","Classic Obby","Tower Obby","Runner","Party & Casual","Childhood Game","Minigame","Quiz","Coloring & Drawing","Puzzle","Escape Room","Hidden Object","Match & Merge","Thinking Puzzle","RNG","Roleplay & Avatar Sim","Animal Sim","Dress Up","Life","Morph Roleplay","Pet Care","Shooter","Battle Royale","Deathmatch","PvE Shooter","Tactical Shooter","Shopping","Simulation","Tycoon","Incremental Simulator","Physics Sim","Sandbox","Tapping","Vehicle Sim","Idle","Social","Chat & Hangout","Content","Showcase","Visit","Sports & Racing","Racing","Sports","Strategy","Tower Defense","Board & Card","Survival","Horror","Open World Survival","1 vs All","Escape","Utility & Other"];

/* ---------- Curated genre map (gives tags + powers recommendations) ---------- */
const CURATED = [
  ["Adopt Me",["Roleplay & Avatar Sim","Pet Care","Social"]],["Brookhaven",["Roleplay & Avatar Sim","Life","Social"]],
  ["Blox Fruits",["Action","Open World Action","Adventure"]],["Tower of Hell",["Obby & Platformer","Tower Obby"]],
  ["Grow a Garden",["Simulation","Sandbox","Social"]],["Steal a Brainrot",["Simulation","Party & Casual","Social"]],
  ["Steal An Egg",["Simulation","Party & Casual","Social"]],["Murder Mystery 2",["Party & Casual","Minigame","Survival"]],
  ["MeepCity",["Roleplay & Avatar Sim","Social","Life"]],["Pet Simulator 99",["Simulation","Incremental Simulator","Pet Care"]],
  ["Pet Simulator X",["Simulation","Incremental Simulator","Pet Care"]],["Bloxburg",["Roleplay & Avatar Sim","Life"]],
  ["Jailbreak",["Action","Open World Action","Racing"]],["Royale High",["Roleplay & Avatar Sim","Dress Up","Adventure"]],
  ["Doors",["Survival","Horror","Puzzle"]],["Piggy",["Survival","Horror","Puzzle"]],["Arsenal",["Shooter","Deathmatch"]],
  ["Phantom Forces",["Shooter","Tactical Shooter"]],["Bee Swarm",["Simulation","Adventure","Pet Care"]],
  ["Work at a Pizza Place",["Roleplay & Avatar Sim","Life","Party & Casual"]],["Natural Disaster Survival",["Survival","Party & Casual"]],
  ["Theme Park Tycoon",["Simulation","Tycoon"]],["Retail Tycoon",["Simulation","Tycoon"]],["Lumber Tycoon",["Simulation","Tycoon","Sandbox"]],
  ["Tower Defense Simulator",["Strategy","Tower Defense"]],["All Star Tower Defense",["Strategy","Tower Defense"]],
  ["Anime Adventures",["Strategy","Tower Defense"]],["Toilet Tower Defense",["Strategy","Tower Defense"]],
  ["Rivals",["Shooter","Deathmatch","Tactical Shooter"]],["Fisch",["Simulation","Adventure","Social"]],
  ["Dress to Impress",["Party & Casual","Dress Up","Social"]],["99 Nights in the Forest",["Survival","Open World Survival","Horror"]],
  ["Shindo Life",["Action","Open World Action","Battlegrounds & Fighting"]],["The Strongest Battlegrounds",["Action","Battlegrounds & Fighting"]],
  ["Untitled Boxing Game",["Action","Battlegrounds & Fighting"]],["Da Hood",["Action","Open World Action","Roleplay & Avatar Sim"]],
  ["Build A Boat",["Adventure","Sandbox","Puzzle"]],["Flee the Facility",["Survival","Party & Casual","Horror"]],
  ["Islands",["Simulation","Sandbox","Survival"]],["Pls Donate",["Social","Chat & Hangout","Shopping"]],
  ["Driving Empire",["Sports & Racing","Racing","Roleplay & Avatar Sim"]],["Car Dealership Tycoon",["Simulation","Tycoon","Vehicle Sim"]],
  ["Greenville",["Roleplay & Avatar Sim","Life","Vehicle Sim"]],["Emergency Response",["Roleplay & Avatar Sim","Life","Vehicle Sim"]],
  ["Mad City",["Action","Open World Action"]],["King Legacy",["Action","Open World Action","Adventure"]],
  ["Blade Ball",["Action","Battlegrounds & Fighting"]],["Combat Warriors",["Action","Battlegrounds & Fighting","Deathmatch"]],
  ["Evade",["Survival","Horror","1 vs All"]],["Apeirophobia",["Survival","Horror","Puzzle"]],["The Mimic",["Survival","Horror","Story"]],
  ["Rainbow Friends",["Roleplay & Avatar Sim","Survival","Horror"]],["Pressure",["Survival","Horror","Puzzle"]],
  ["Dead Rails",["Survival","Open World Survival","Horror"]],["Sols RNG",["RNG","Idle"]],["Dandy",["Survival","Horror","1 vs All"]],
  ["BedWars",["Strategy","Battlegrounds & Fighting","Survival"]],["Bubble Gum Simulator",["Simulation","Incremental Simulator","Pet Care"]],
  ["Epic Minigames",["Party & Casual","Minigame"]],["Ultimate Football",["Sports & Racing","Sports"]],
  ["Football Fusion",["Sports & Racing","Sports"]],["A One Piece Game",["Action","Open World Action","Battlegrounds & Fighting"]],
  ["Jujutsu Shenanigans",["Action","Battlegrounds & Fighting","Anime"]],["Anime Fighting Simulator",["Simulation","Battlegrounds & Fighting"]],
  ["Livetopia",["Roleplay & Avatar Sim","Life","Social"]],["Berry Avenue",["Roleplay & Avatar Sim","Life","Social"]],
  ["Horse Life",["Roleplay & Avatar Sim","Animal Sim","Pet Care"]],["Creatures of Sonaria",["Roleplay & Avatar Sim","Animal Sim","Survival"]],
  ["Dragon Adventures",["Roleplay & Avatar Sim","Animal Sim","Adventure"]]
];
function cleanName(s){ return String(s).toLowerCase().replace(/[^a-z0-9]/g,""); }
const CURATED_CLEAN = CURATED.map(([n,g])=>[cleanName(n),g]).sort((a,b)=>b[0].length-a[0].length);
function genresFor(name){ const c=cleanName(name); for(const [k,g] of CURATED_CLEAN){ if(c.includes(k)) return g.slice(); } return []; }
// recommendation pool from curated (name + genres), de-duplicated
const RECPOOL = CURATED.map(([n,g])=>({name:n,genres:g}));

/* ---------- Games catalog (loaded from games.json) ---------- */
let GAMES=[]; let GAMEIDX={};
async function loadGames(){
  try{
    const r=await fetch("games.json"); const d=await r.json();
    GAMES=(d.games||[]).map(([id,name,ccu,thumb])=>({id,name,ccu,thumb,genres:genresFor(name)}));
  }catch(e){ GAMES=RECPOOL.map((g,i)=>({id:0,name:g.name,ccu:0,thumb:"",genres:g.genres})); }
  GAMEIDX={}; GAMES.forEach(g=>GAMEIDX[g.name.toLowerCase()]=g);
  document.getElementById("gameNames").innerHTML=GAMES.slice(0,1200).map(g=>'<option value="'+esc(g.name)+'">').join("");
}

/* ---------- Store (API when configured, else localStorage) ---------- */
const LS_KEY="reviewblox_v3", SES_KEY="reviewblox_session";
let state={ reviews:[], critics:[], favorites:[], accounts:{} };
let session=null;
const online=!!API_BASE;

function saveLocal(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }catch(e){} }
function loadLocal(){ try{ const d=JSON.parse(localStorage.getItem(LS_KEY)); if(d){ state.reviews=d.reviews||[]; state.critics=d.critics||[]; state.favorites=d.favorites||[]; state.accounts=d.accounts||{}; } }catch(e){} }
function loadSession(){ try{ session=JSON.parse(localStorage.getItem(SES_KEY))||null; }catch(e){ session=null; } }
function saveSession(){ try{ session?localStorage.setItem(SES_KEY,JSON.stringify(session)):localStorage.removeItem(SES_KEY); }catch(e){} }

async function api(path,opts){ const r=await fetch(API_BASE+path,Object.assign({headers:{"Content-Type":"application/json"}},opts)); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||("API "+r.status)); return j; }
async function sha(s){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }

async function boot(){
  loadLocal(); loadSession();
  await loadGames();
  if(online){
    try{ const d=await api("/api/state"); state.reviews=d.reviews||[]; state.critics=d.critics||[]; saveLocal();
      document.getElementById("apiFlag").textContent="shared mode · live"; document.getElementById("apiFlag").classList.add("on");
    }catch(e){ document.getElementById("apiFlag").textContent="shared mode offline — showing local"; }
  }
  updateAcctUI(); route();
}

/* ---------- auth ---------- */
function isOwnerName(n){ return String(n||"").toLowerCase()===OWNER_USERNAME.toLowerCase(); }
async function doLogin(username,password){
  username=username.trim(); if(!username) throw new Error("Enter a username.");
  if(online){
    const u=await api("/api/login",{method:"POST",body:JSON.stringify({username,password})});
    session={username:u.username,critic:!!u.critic,owner:!!u.owner,pw:password};
  }else{
    const key=username.toLowerCase(); const acct=state.accounts[key];
    if(acct&&acct.password){ if((await sha(password))!==acct.password) throw new Error("Wrong password."); }
    else if(acct&&isOwnerName(username)&&password&&password.toLowerCase()!=="none"){ acct.password=await sha(password); saveLocal(); }
    if(!acct){ const pw=(password&&password.toLowerCase()!=="none")?await sha(password):null; state.accounts[key]={username,password:pw,critic:isOwnerName(username)?1:0}; saveLocal(); }
    const a=state.accounts[key];
    session={username:a.username,critic:!!a.critic||isOwnerName(username),owner:isOwnerName(username)};
    refreshLocalCritics();
  }
  saveSession(); updateAcctUI();
}
function logout(){ session=null; saveSession(); updateAcctUI(); location.hash="#/"; }
function refreshLocalCritics(){ state.critics=Object.values(state.accounts).filter(a=>a.critic).map(a=>a.username); if(!state.critics.some(isOwnerName)) {} saveLocal(); }

async function promote(username,password,critic){
  if(online){
    await api("/api/admin/promote",{method:"POST",body:JSON.stringify({ownerUsername:session.username,ownerPassword:session.pw,username,password,critic})});
    const d=await api("/api/state"); state.critics=d.critics||[]; saveLocal();
  }else{
    const key=username.trim().toLowerCase(); const pw=(password&&password.toLowerCase()!=="none")?await sha(password):null;
    state.accounts[key]={username:username.trim(),password:pw,critic:critic?1:0}; refreshLocalCritics();
  }
}

/* ---------- review ops ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function slug(s){ return encodeURIComponent(s); }
function fmt(n){ return n>=1000? n.toLocaleString():String(n); }
function starStr(r){ let s=""; for(let i=1;i<=5;i++) s+= i<=Math.round(r)?"★":'<span class="off">★</span>'; return '<span class="starsm">'+s+"</span>"; }
function isCritic(name){ return state.critics.some(c=>String(c).toLowerCase()===String(name).toLowerCase()); }
function robloxUrl(g){ return g&&g.id? "https://www.roblox.com/games/"+g.id : "https://www.roblox.com/games/?keyword="+encodeURIComponent(g&&g.name||g); }
function canEdit(r){ return session && (session.owner || String(session.username).toLowerCase()===String(r.author).toLowerCase()); }

async function addReview(r){
  if(online){ try{ const saved=await api("/api/reviews",{method:"POST",body:JSON.stringify(r)}); state.reviews.push(saved); saveLocal(); return; }catch(e){ alert("Couldn't reach the server; saved locally."); } }
  state.reviews.push(r); saveLocal();
}
async function updateReview(id,patch){ const r=state.reviews.find(x=>x.id===id); if(!r)return; Object.assign(r,patch); if(online){try{await api("/api/reviews/"+id,{method:"PATCH",body:JSON.stringify(patch)});}catch(e){}} saveLocal(); }
async function deleteReview(id){ state.reviews=state.reviews.filter(x=>x.id!==id); if(online){try{await api("/api/reviews/"+id,{method:"DELETE"});}catch(e){}} saveLocal(); }
async function likeReview(id){ const r=state.reviews.find(x=>x.id===id); if(!r)return; r.liked=!r.liked; r.likes=(r.likes||0)+(r.liked?1:-1); if(r.likes<0)r.likes=0; if(online){try{await api("/api/reviews/"+id+"/like",{method:"POST",body:JSON.stringify({liked:r.liked})});}catch(e){}} saveLocal(); }

/* ---------- game helpers ---------- */
function reviewIndex(){ const m={}; state.reviews.forEach(r=>{ const k=r.game.toLowerCase(); (m[k]=m[k]||[]).push(r); }); return m; }
function makeGame(g,rv){ const genres=(g.genres||[]).slice(); rv.forEach(r=>(r.genres||[]).forEach(x=>{if(!genres.includes(x))genres.push(x);})); const n=rv.length; return {id:g.id,name:g.name,ccu:g.ccu||0,thumb:g.thumb||"",genres,reviews:rv,count:n,avg:n?rv.reduce((a,r)=>a+r.rating,0)/n:0}; }
function gameList(){ const idx=reviewIndex(); const list=GAMES.map(g=>makeGame(g,idx[g.name.toLowerCase()]||[])); const known=new Set(GAMES.map(g=>g.name.toLowerCase())); Object.keys(idx).forEach(k=>{ if(!known.has(k)){ list.push(makeGame({id:0,name:idx[k][0].game,ccu:0,thumb:"",genres:genresFor(idx[k][0].game)},idx[k])); } }); return list; }
function getGame(name){ const idx=reviewIndex(); const rv=idx[name.toLowerCase()]||[]; const g=GAMEIDX[name.toLowerCase()]||{id:0,name,ccu:0,thumb:"",genres:genresFor(name)}; return makeGame(g,rv); }
function reviewedGames(){ const idx=reviewIndex(); return Object.keys(idx).map(k=>getGame(idx[k][0].game)); }

/* ---------- Router ---------- */
function route(){
  const h=location.hash.split("?")[0].replace(/^#\/?/,""); const [path,rest]=h.split("/");
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("active",(a.dataset.r||"")===path));
  const v=document.getElementById("view");
  ({"":renderHome,browse:renderBrowse,game:v2=>renderGame(v,decodeURIComponent(rest||"")),write:renderWrite,charts:renderCharts,critics:renderCritics,account:renderAccount,login:renderLogin}[path]||renderHome)(v);
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
function qparam(n){ const m=location.hash.match(new RegExp("[?&]"+n+"=([^&]+)")); return m?decodeURIComponent(m[1]):""; }
document.getElementById("topSearch").addEventListener("keydown",e=>{ if(e.key==="Enter"){ const q=e.target.value.trim(); location.hash="#/browse"+(q?("?q="+encodeURIComponent(q)):""); } });

/* ---------- account chip ---------- */

function gcard(g){
  const rate=g.count? `${starStr(g.avg)} <span class="muted">${g.avg.toFixed(1)} · ${g.count}</span>` : '<span class="muted">No reviews</span>';
  const thumb=g.thumb? `<img class="thumb" loading="lazy" src="${esc(g.thumb)}" alt="">` : `<div class="thumb"></div>`;
  return `<div class="gcard" onclick="location.hash='#/game/${slug(g.name)}'">${thumb}<div class="body">
    <div class="gtitle">${esc(g.name)}</div>
    <div class="gtags">${g.genres.length?g.genres.map(esc).join(" · "):"&nbsp;"}</div>
    <div class="grate">${rate}${g.ccu?`<span class="ccu">▶ ${fmt(g.ccu)}</span>`:""}</div></div></div>`;
}

/* ---------- BROWSE ---------- */
function renderBrowse(v){
  const q0=qparam("q");
  v.innerHTML=`<div class="hero" style="padding-top:10px"><h1>Browse games</h1><p>Search ${fmt(GAMES.length)} games, filter by tag, or review any game.</p></div>
    <div class="toolbar">

      <select id="bSort"><option value="pop">Most played</option><option value="top">Top rated</option><option value="most">Most reviewed</option><option value="az">A–Z</option></select>
    </div><div id="bResults"></div>`;
  const run=()=>{
    const q=document.getElementById("bSearch").value.toLowerCase().trim();
    const tag=document.getElementById("bTag").value, sort=document.getElementById("bSort").value;
    const idx=reviewIndex();
    let base;
    if(tag || sort!=="pop" || q){ base=gameList(); } else { base=GAMES.map(g=>makeGame(g,idx[g.name.toLowerCase()]||[])); }
    let list=base;
    if(tag) list=list.filter(g=>g.genres.includes(tag));
    if(q) list=list.filter(g=>g.name.toLowerCase().includes(q)||g.genres.some(x=>x.toLowerCase().includes(q)));
    list.sort((a,b)=>({pop:b.ccu-a.ccu||b.count-a.count,top:b.avg-a.avg||b.count-a.count,most:b.count-a.count,az:a.name.localeCompare(b.name)})[sort]);
    const res=document.getElementById("bResults"); let html="";
    if(q && !list.some(g=>g.name.toLowerCase()===q)){
      const typed=document.getElementById("bSearch").value.trim();
      html+=`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div>Want to review a game not listed? </div><button class="btn sm blue" onclick="location.hash='#/write?g=${encodeURIComponent(typed)}'">Review "${esc(typed)}"</button></div>`;
    }
    html+= list.length? `<div class="muted" style="margin-bottom:8px">${fmt(list.length)} game${list.length!==1?"s":""}</div><div class="grid">${list.slice(0,60).map(gcard).join("")}</div>` : '<div class="empty">No games match.</div>';
    res.innerHTML=html;
  };
  document.getElementById("bSearch").oninput=run; document.getElementById("bTag").onchange=run; document.getElementById("bSort").onchange=run; run();
}

  si.querySelectorAll("span").forEach(s=>{s.onmouseenter=()=>paint(+s.dataset.v);s.onclick=()=>{writeStars=+s.dataset.v;paint(writeStars);};}); si.onmouseleave=()=>paint(writeStars); paint(writeStars);

/* ---------- recommendations ---------- */
function buildTaste(){ const w={}; state.reviews.filter(r=>session&&String(r.author).toLowerCase()===String(session.username).toLowerCase()).forEach(r=>{ const wt=(r.rating-2.5)*(isCritic(r.author)?1.5:1); (r.genres||[]).forEach(g=>w[g]=(w[g]||0)+wt); }); state.favorites.forEach(f=>{ genresFor(f).forEach(g=>w[g]=(w[g]||0)+0.75); }); return w; }
function renderRecsInto(){
  const taste=buildTaste(); const pos=Object.entries(taste).filter(([,x])=>x>0).sort((a,b)=>b[1]-a[1]);
  const sum=document.getElementById("tasteSummary"),bars=document.getElementById("tasteBars"),list=document.getElementById("recList");
  if(!pos.length){ sum.textContent="Write a few reviews (3★+ with tags) to unlock recommendations."; bars.innerHTML="";list.innerHTML=""; return; }
  sum.textContent="You lean toward: "+pos.slice(0,3).map(x=>x[0]).join(", ");
  bars.innerHTML=pos.slice(0,5).map(([g,x])=>`<div style="margin-top:8px"><div class="muted" style="font-size:.78rem">${esc(g)}</div><div class="bar"><i style="width:${Math.round(x/pos[0][1]*100)}%"></i></div></div>`).join("");
  const reviewed=new Set(state.reviews.map(r=>r.game.toLowerCase()));
  const scored=RECPOOL.filter(c=>!reviewed.has(c.name.toLowerCase())).map(c=>{ let s=0,m=[]; c.genres.forEach(g=>{if(taste[g]>0){s+=taste[g];m.push(g);}}); if(state.favorites.some(f=>f.toLowerCase()===c.name.toLowerCase()))s+=1.5; return {...c,score:s,matched:m}; }).filter(c=>c.score>0).sort((a,b)=>b.score-a.score).slice(0,10);
  if(!scored.length){ list.innerHTML='<div class="muted" style="margin-top:12px">No matches yet.</div>'; return; }
  const max=scored[0].score;
  list.innerHTML=scored.map(c=>`<div class="rec" onclick="location.hash='#/game/${slug(c.name)}'"><div class="score"><b>${Math.round(c.score/max*100)}</b><i>MATCH</i></div><div><h3>${esc(c.name)}</h3><div class="muted" style="font-size:.78rem">${c.genres.map(esc).join(" · ")}</div><div class="why">Because you like ${c.matched.map(esc).join(", ")}</div></div></div>`).join("");
}
async function linkRoblox(){
  const user=document.getElementById("rbxUser").value.trim(), status=document.getElementById("linkStatus"), favEl=document.getElementById("favList");
  if(!user)return status.textContent="Enter a username."; status.textContent="Looking up "+user+"…"; favEl.innerHTML="";
  try{
    const r=await fetch("https://users.roblox.com/v1/usernames/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({usernames:[user],excludeBannedUsers:true})});
    const d=await r.json(); if(!d.data||!d.data.length)return status.textContent="No Roblox user found.";
    const id=d.data[0].id; status.textContent="Fetching favorites…";
    const fr=await fetch(`https://games.roblox.com/v2/users/${id}/favorite/games?limit=25&sortOrder=Desc`); const fd=await fr.json();
    const titles=(fd.data||[]).map(x=>x.name).filter(Boolean); if(!titles.length)return status.textContent="No public favorites found.";
    state.favorites=titles; saveLocal(); status.innerHTML=`✅ Imported ${titles.length} favorites.`; favEl.innerHTML='<div class="chips">'+titles.map(t=>'<span class="chip sm">'+esc(t)+'</span>').join("")+'</div>'; renderRecsInto();
  }catch(e){ status.innerHTML="⚠️ Roblox blocked the request (CORS). Your reviews still power recommendations."; }
}
function exportData(){ const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="reviewblox-backup.json"; a.click(); }
function clearData(){ if(confirm("Clear local reviews, accounts & favorites from THIS browser?")){ state={reviews:[],critics:[],favorites:[],accounts:{}}; saveLocal(); location.hash="#/"; route(); } }

/* ---------- CHARTS ---------- */
function renderCharts(v){
  const reviews=state.reviews;
  if(!reviews.length){ v.innerHTML='<div class="hero" style="padding-top:10px"><h1>📊 Charts</h1></div><div class="empty">No data yet. Write some reviews to see charts.</div>'; return; }
  const dist=[0,0,0,0,0]; reviews.forEach(r=>dist[r.rating-1]++); const maxd=Math.max(...dist);
  const gc={}; reviews.forEach(r=>(r.genres||[]).forEach(g=>gc[g]=(gc[g]||0)+1)); const genres=Object.entries(gc).sort((a,b)=>b[1]-a[1]).slice(0,10); const maxg=Math.max(1,...genres.map(x=>x[1]));
  const games=reviewedGames().sort((a,b)=>b.avg-a.avg||b.count-a.count).slice(0,10);
  const crit=reviews.filter(r=>isCritic(r.author)), comm=reviews.filter(r=>!isCritic(r.author));
  const cavg=crit.length?crit.reduce((a,r)=>a+r.rating,0)/crit.length:0, uavg=comm.length?comm.reduce((a,r)=>a+r.rating,0)/comm.length:0;
  const played=[...GAMES].slice(0,10);
  v.innerHTML=`<div class="hero" style="padding-top:10px"><h1>📊 Charts</h1></div>
    <div class="card"><h2>Most played on Roblox (live snapshot)</h2>${played.map(g=>`<div class="chartrow"><div class="lab">${esc(g.name)}</div><div class="bar"><i style="width:${Math.round(g.ccu/played[0].ccu*100)}%;background:var(--green)"></i></div><div class="val">${fmt(g.ccu)}</div></div>`).join("")}</div>
    <div class="card"><h2>Rating distribution</h2>${[5,4,3,2,1].map(s=>`<div class="chartrow"><div class="lab" style="width:46px">${s} ★</div><div class="bar"><i style="width:${Math.round(dist[s-1]/Math.max(1,maxd)*100)}%;background:var(--gold)"></i></div><div class="val">${dist[s-1]}</div></div>`).join("")}</div>
    <div class="card"><h2>Reviews by tag</h2>${genres.map(([g,n])=>`<div class="chartrow"><div class="lab">${esc(g)}</div><div class="bar"><i style="width:${Math.round(n/maxg*100)}%"></i></div><div class="val">${n}</div></div>`).join("")}</div>
    <div class="card"><h2>Top rated games</h2>${games.map(g=>`<div class="chartrow"><div class="lab">${esc(g.name)}</div><div class="bar"><i style="width:${Math.round(g.avg/5*100)}%;background:var(--green)"></i></div><div class="val">${g.avg.toFixed(1)}</div></div>`).join("")}</div>
    ${crit.length?`<div class="card"><h2>Critics vs community</h2><div class="chartrow"><div class="lab">Pro critics</div><div class="bar"><i style="width:${Math.round(cavg/5*100)}%;background:var(--purple)"></i></div><div class="val">${cavg.toFixed(1)}</div></div><div class="chartrow"><div class="lab">Community</div><div class="bar"><i style="width:${Math.round(uavg/5*100)}%"></i></div><div class="val">${uavg.toFixed(1)}</div></div></div>`:""}`;
}

boot();
</script>
</body>
</html>
